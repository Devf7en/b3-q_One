name: Identity acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false jose@6.1.0
      - run: node integration-tests/oidc-verifier.mjs
      - run: node integration-tests/id-token.mjs
