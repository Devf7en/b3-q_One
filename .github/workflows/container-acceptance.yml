name: Container acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      ONE_DB_PASSWORD: disposable-ci-only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: |
          curl --fail http://127.0.0.1:4173/
          curl --fail http://127.0.0.1:4173/registry/workspaces
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/.env)" = 404
          docker compose exec -T postgres pg_isready -U postgres -d one_dev
      - if: always()
        run: docker compose down -v
