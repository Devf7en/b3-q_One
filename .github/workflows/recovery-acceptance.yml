name: Recovery acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: one_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: one_test
    steps:
      - uses: actions/checkout@v4
      - run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          pg_dump --version | grep -E ' 16\.'
          pg_restore --version | grep -E ' 16\.'
          for migration in database/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          bash database/tests/restore-acceptance.sh
