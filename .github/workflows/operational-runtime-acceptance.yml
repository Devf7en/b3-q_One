name: Operational runtime acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: one_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: one_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false pg@8.16.3 jose@6.1.0
      - run: |
          for migration in database/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          node integration-tests/operational-runtime.mjs
