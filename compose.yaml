name: b3eq-one
services:
  application:
    build: .
    ports:
      - "127.0.0.1:4173:4173"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:4173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: one_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ONE_DB_PASSWORD:?Set ONE_DB_PASSWORD}
    volumes:
      - one-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD","pg_isready","-U","postgres","-d","one_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]
networks:
  data:
    internal: true
volumes:
  one-data:
